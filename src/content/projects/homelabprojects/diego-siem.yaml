title: "dieGO SIEM"

description: "Developing dieGO SIEM (Security Information and Event Management) from scratch in Go. It collects, processes, and visualizes security events, using ClickHouse for log storage, PostgreSQL for metadata, and React for the web interface. Includes a Docker-based lab to simulate attacks and validate detection capabilities, with integrated log ingestion from Bitwarden/Vaultwarden."

