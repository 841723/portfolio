title: "Home Lab Setup"

# un ubuntu server conectado a la corriente 24/7. 4th gen intel i3, 4 cores 4 GB RAM. pensado para automatizar tareas, alojar servicios personales y experimentar con nuevas tecnologías. uso docker para gestionar mis contenedores. también tengo un sistema de backup automático para proteger mis datos importantes..
descriptionHtml:  "I run a personal home lab on an Ubuntu Server that is powered on 24/7, hosted on an old laptop with a 4th generation Intel i3 and 4 GB of RAM. It is designed to automate tasks, host personal services, and experiment with new technologies in a controlled environment. I use Docker to manage and isolate the different services running on the system. Despite the limited hardware, the setup is optimized to be lightweight and efficient. I have also implemented an automatic backup system to protect important data. This environment allows me to continuously learn, build, and test real-world solutions."

